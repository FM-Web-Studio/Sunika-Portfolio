<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF6F1" />
    <meta name="description" content="Sunika Lombard, communication design and illustration. Suni Designs: create, inspire, mark leaving." />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sunika Lombard | Communication Design and Illustration</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('suni.prefs') || '{}');
        var dark = p.theme ? p.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        var still = typeof p.reduceMotion === 'boolean' ? p.reduceMotion : matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.motion = still ? 'reduced' : 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this site.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
