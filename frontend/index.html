<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF6F1" />
    <meta name="description" content="Sunika Lombard, communication design and illustration. Suni Designs: create, inspire, mark leaving." />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sunika Lombard | Communication Design and Illustration</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('suni.prefs') || '{}');
        var dark = p.theme ? p.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        var still = typeof p.reduceMotion === 'boolean' ? p.reduceMotion : matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.motion = still ? 'reduced' : 'full';
        var last = Number(localStorage.getItem('suni.intro')) || 0;
        if (!still && location.pathname.indexOf('/admin') !== 0 && Date.now() - last > 12 * 36e5) {
          document.documentElement.dataset.intro = 'playing';
          localStorage.setItem('suni.intro', String(Date.now()));
          setTimeout(function () {
            var root = document.documentElement;
            if (!root.dataset.intro) return;
            delete root.dataset.intro;
            var el = document.getElementById('intro');
            if (el) el.remove();
          }, 9000);
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      html[data-intro] #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: block;
      }
      #intro .panel,
      #intro .wash {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      #intro .panel {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--paper, #FBF6F1);
      }
      #intro .wash { background: var(--coral, #DC3F55); }
      html[data-intro='playing'],
      html[data-intro='playing'] body { overflow: hidden; }
      #intro .stage {
        position: relative;
        width: min(72vw, 340px);
        aspect-ratio: 1;
        transition: transform 700ms cubic-bezier(0.7, 0, 0.3, 1), opacity 500ms ease;
      }
      #intro .shape {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: intro-pop 700ms cubic-bezier(0.34, 1.5, 0.64, 1) forwards, intro-float 6s ease-in-out 900ms infinite;
      }
      #intro .coral { width: 46%; aspect-ratio: 1; right: 0; top: 2%; background: var(--coral, #DC3F55); opacity: 0.92; animation-delay: 80ms, 900ms; }
      #intro .teal { width: 36%; aspect-ratio: 1; left: 2%; bottom: 10%; border-radius: 50% 50% 0 50%; background: var(--teal, #3FB8A0); animation-delay: 220ms, 1.4s; }
      #intro .sun { width: 13%; aspect-ratio: 1; left: 12%; top: 10%; background: var(--sun, #F5BF4F); animation-delay: 360ms, 1.9s; }
      #intro .logo {
        position: absolute;
        left: 11%;
        top: 9%;
        width: 78%;
        height: auto;
        opacity: 0;
        transform: translateY(18px) scale(0.86) rotate(-5deg);
        animation: intro-logo 800ms cubic-bezier(0.34, 1.4, 0.64, 1) 480ms forwards;
        filter: drop-shadow(0 10px 24px rgba(74, 38, 48, 0.18));
      }
      #intro .swoosh {
        position: absolute;
        left: 14%;
        bottom: 2%;
        width: 72%;
        overflow: visible;
      }
      #intro .swoosh path {
        fill: none;
        stroke: var(--coral, #DC3F55);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: intro-draw 900ms cubic-bezier(0.6, 0, 0.3, 1) 900ms forwards;
      }
      #intro .swoosh path + path { stroke: var(--teal, #3FB8A0); stroke-width: 4; animation-delay: 1.15s; }
      #intro.lift .panel,
      #intro.lift .wash {
        transform: translate3d(0, -110%, 0);
        border-radius: 0 0 50% 50% / 0 0 14vh 14vh;
        transition: transform 850ms cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro.lift .wash { transition-delay: 130ms; }
      #intro.lift .stage { transform: translate3d(0, -12vh, 0) scale(0.92); opacity: 0; }
      @keyframes intro-pop { to { transform: scale(1); } }
      @keyframes intro-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
      @keyframes intro-logo { to { opacity: 1; transform: none; } }
      @keyframes intro-draw { to { stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this site.</noscript>
    <div id="intro" aria-hidden="true">
      <div class="wash"></div>
      <div class="panel">
        <div class="stage">
        <span class="shape coral"></span>
        <span class="shape teal"></span>
        <span class="shape sun"></span>
        <img class="logo" src="/intro-wordmark.webp" alt="" width="520" height="510" />
        <svg class="swoosh" viewBox="0 0 200 30" preserveAspectRatio="none">
          <path pathLength="1" d="M4 20 C 50 6 110 4 196 14" />
          <path pathLength="1" d="M40 26 C 80 18 130 18 170 24" />
        </svg>
      </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
